name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Repo variable DEPLOY_RUNNER lets you switch between GitHub-hosted and self-hosted.
    #   hosted:      leave unset (defaults to ubuntu-latest) -> deploys to server.* over SSH
    #   self-hosted: set DEPLOY_RUNNER to 'self-hosted' (or your label) -> deploys locally, omit server.*
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Write config from the single secret
        env:
          DEPLOY_CONFIG_JSON: ${{ secrets.DEPLOY_CONFIG_JSON }}
        run: |
          if [ -z "${DEPLOY_CONFIG_JSON}" ]; then
            echo "::error::Missing repository secret DEPLOY_CONFIG_JSON"; exit 1
          fi
          printf '%s' "${DEPLOY_CONFIG_JSON}" > config.json
          node -e "JSON.parse(require('fs').readFileSync('config.json','utf8'))" \
            || { echo '::error::DEPLOY_CONFIG_JSON is not valid JSON'; exit 1; }

      - name: Deploy
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci-deploy.sh

      - name: Cleanup
        if: always()
        run: rm -f config.json .cf-resolved.json ~/.ssh/id_deploy || true
