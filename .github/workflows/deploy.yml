name: Deploy

# Manual-only: real deployments target a persistent host (self-hosted runner or server.*).
# The push-triggered path for testing is handled by keepalive.yml.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Write config from the single secret
        env:
          DEPLOY_CONFIG_JSON: ${{ secrets.DEPLOY_CONFIG_JSON }}
        run: |
          if [ -z "${DEPLOY_CONFIG_JSON}" ]; then
            echo "::error::Missing repository secret DEPLOY_CONFIG_JSON"; exit 1
          fi
          printf '%s' "${DEPLOY_CONFIG_JSON}" > config.json
          node -e "JSON.parse(require('fs').readFileSync('config.json','utf8'))" \
            || { echo '::error::DEPLOY_CONFIG_JSON is not valid JSON'; exit 1; }

      # --- Docker image cache (no builds here; we cache the PULLED prebuilt images) ---
      - name: Compute image cache key
        id: imgkey
        run: |
          chmod +x scripts/*.sh
          echo "key=$(./scripts/image-cache.sh key)" >> "$GITHUB_OUTPUT"

      - name: Restore Docker image cache
        id: imgcache
        uses: actions/cache/restore@v4
        with:
          path: .image-cache
          key: ${{ steps.imgkey.outputs.key }}
          restore-keys: |
            imgcache-

      - name: Load cached images into Docker
        if: hashFiles('.image-cache/**') != ''
        run: ./scripts/image-cache.sh load .image-cache

      - name: Deploy
        run: ./scripts/ci-deploy.sh

      - name: Save Docker image cache
        if: always() && steps.imgcache.outputs.cache-hit != 'true'
        run: ./scripts/image-cache.sh save .image-cache || true

      - name: Persist Docker image cache
        if: always() && steps.imgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .image-cache
          key: ${{ steps.imgkey.outputs.key }}

      - name: Cleanup
        if: always()
        run: rm -f config.json .cf-resolved.json ~/.ssh/id_deploy || true
