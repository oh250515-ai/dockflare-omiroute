# Azure Pipelines equivalent of the GitHub Actions workflow.
#
# Setup:
#   1) Pipeline > Edit > Variables > add DEPLOY_CONFIG_JSON as a SECRET variable
#      (the same single JSON object used everywhere).
#   2) Choose where it runs:
#        - Microsoft-hosted agent (ephemeral): keep `vmImage: ubuntu-latest` and
#          include a "server" block in the JSON so it deploys to your host over SSH.
#        - Self-hosted agent (persistent): replace the `pool:` block with
#            pool:
#              name: 'YourSelfHostedPool'
#          and OMIT the "server" block so it deploys on the agent's local Docker.
#
# Requires Docker (+ compose plugin) available to the agent.

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  # Filled at runtime from the image list; used as the cache key.
  IMAGE_CACHE_KEY: 'bootstrap'

steps:
  - checkout: self

  - script: |
      if [ -z "$DEPLOY_CONFIG_JSON" ]; then
        echo "##vso[task.logissue type=error]Missing DEPLOY_CONFIG_JSON pipeline secret"; exit 1
      fi
      printf '%s' "$DEPLOY_CONFIG_JSON" > config.json
      node -e "JSON.parse(require('fs').readFileSync('config.json','utf8'))" \
        || { echo '##vso[task.logissue type=error]DEPLOY_CONFIG_JSON is not valid JSON'; exit 1; }
    displayName: Write config from the single secret
    env:
      DEPLOY_CONFIG_JSON: $(DEPLOY_CONFIG_JSON)

  # Compute the image cache key and expose it as a pipeline variable for Cache@2.
  - script: |
      chmod +x scripts/*.sh
      KEY=$(./scripts/image-cache.sh key)
      echo "##vso[task.setvariable variable=IMAGE_CACHE_KEY]$KEY"
      echo "Image cache key: $KEY"
    displayName: Compute image cache key

  # Cache the PULLED prebuilt Docker images (no builds here). Restores before deploy,
  # saves .image-cache after the job on a cache miss.
  - task: Cache@2
    displayName: Cache Docker images
    inputs:
      key: '"$(IMAGE_CACHE_KEY)"'
      restoreKeys: |
        imgcache-
      path: '$(Build.SourcesDirectory)/.image-cache'

  - script: |
      ./scripts/image-cache.sh load .image-cache || true
    displayName: Load cached images into Docker

  - script: |
      ./scripts/ci-deploy.sh
    displayName: Deploy

  # Populate the cache dir so Cache@2 stores it at job end (Cache@2 saves automatically
  # when the key was not found on restore).
  - script: |
      ./scripts/image-cache.sh save .image-cache || true
    displayName: Save images to cache dir
    condition: always()

  - script: rm -f config.json .env .df-seed.json ~/.ssh/id_deploy || true
    condition: always()
    displayName: Cleanup
